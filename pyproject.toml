[project]
name = "in-tune-agent"
version = "0.1.0"
description = "Customer service AI agent for Empório da Música (Artefact AI Engineer technical case)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[project.scripts]
in-tune = "in_tune.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/in_tune"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
